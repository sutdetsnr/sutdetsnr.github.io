<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Wi-Fi QR Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="wifi.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="wifi-qr.js"></script>
<style>
  .login { max-width: 380px; margin: 60px auto; }
  .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
  .preview { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .preview canvas { width: 100%; max-width: 320px; height: auto; border: 1px solid var(--border); border-radius: 10px; background: #fff; }
  .row { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .row:first-child { border-top: none; }
  .row .name { flex: 1; min-width: 160px; }
  .row .name small { display: block; color: var(--muted); }
  .row .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .row button { padding: 6px 12px; }
</style>
</head>
<body>
<main>
  <!-- Login -->
  <section id="loginView" class="panel login" hidden>
    <h1>เข้าสู่ระบบผู้ดูแล</h1>
    <p class="hint">สำหรับตั้งค่า Wi-Fi QR Code</p>
    <form id="loginForm">
      <label for="adminPw">รหัสผ่านผู้ดูแล</label>
      <input type="password" id="adminPw" autocomplete="current-password" required>
      <div class="err" id="loginErr" role="alert"></div>
      <button class="primary" id="loginBtn" type="submit">เข้าสู่ระบบ</button>
    </form>
  </section>

  <!-- Admin -->
  <div id="adminView" hidden>
    <div class="top">
      <div>
        <h1>ตั้งค่า Wi-Fi QR Code</h1>
        <p class="lead">เพิ่ม แก้ไข หรือลบเครือข่าย ทุกคนจะเห็น QR Code ที่หน้า <a href="wifi.html" target="_blank">wifi.html</a></p>
      </div>
      <button id="logout">ออกจากระบบ</button>
    </div>

    <div class="layout">
      <section class="panel">
        <h2 id="formTitle">เพิ่มเครือข่ายใหม่</h2>
        <form id="netForm">
          <label for="ssid">ชื่อ Wi-Fi (SSID)</label>
          <input type="text" id="ssid" autocomplete="off" maxlength="64">

          <label for="security">ประเภทความปลอดภัย</label>
          <select id="security">
            <option value="WPA">WPA / WPA2 / WPA3 (ทั่วไป)</option>
            <option value="WEP">WEP (รุ่นเก่า)</option>
            <option value="nopass">ไม่มีรหัสผ่าน (Open)</option>
          </select>

          <div id="pwBlock">
            <label for="password">รหัสผ่าน Wi-Fi</label>
            <input type="text" id="password" autocomplete="off" maxlength="63">
          </div>

          <label class="check"><input type="checkbox" id="hidden"> เครือข่ายซ่อนชื่อ (Hidden SSID)</label>

          <label for="title">หัวข้อบนการ์ด (ไม่บังคับ)</label>
          <input type="text" id="title" value="สแกนเพื่อเชื่อมต่อ Wi-Fi" maxlength="100">

          <div class="err" id="formErr" role="alert"></div>
          <div class="actions">
            <button class="primary" id="saveBtn" type="submit">บันทึก</button>
            <button type="button" id="cancelEdit" hidden>ยกเลิกการแก้ไข</button>
          </div>
        </form>
      </section>

      <section class="panel preview">
        <canvas id="preview" hidden></canvas>
        <div class="empty" id="previewEmpty">กรอกข้อมูลเพื่อดูตัวอย่าง QR Code</div>
      </section>
    </div>

    <section class="panel">
      <h2>เครือข่ายทั้งหมด</h2>
      <div id="list"><div class="empty">กำลังโหลด...</div></div>
    </section>
  </div>

  <div id="notConfigured" class="panel empty" hidden>ยังไม่ได้ใส่ URL ของ Apps Script ในไฟล์ wifi-qr.js</div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const TOKEN_KEY = 'wifiAdminToken';
  const store = {
    get() { try { return sessionStorage.getItem(TOKEN_KEY); } catch { return null; } },
    set(v) { try { sessionStorage.setItem(TOKEN_KEY, v); } catch {} },
    clear() { try { sessionStorage.removeItem(TOKEN_KEY); } catch {} }
  };
  let token = store.get();
  let networks = [];
  let editingId = null;

  if (!WifiQR.configured()) { $('notConfigured').hidden = false; return; }

  function showLogin(msg) {
    token = null; store.clear();
    $('adminView').hidden = true; $('loginView').hidden = false;
    $('loginErr').textContent = msg || '';
    $('adminPw').focus();
  }
  function showAdmin() {
    $('loginView').hidden = true; $('adminView').hidden = false;
  }

  // ---------- login ----------
  $('loginForm').onsubmit = async e => {
    e.preventDefault();
    const btn = $('loginBtn'); btn.disabled = true; $('loginErr').textContent = '';
    try {
      const res = await WifiQR.post({ action: 'login', password: $('adminPw').value });
      if (!res.ok) { $('loginErr').textContent = res.message; return; }
      token = res.token; store.set(token);
      $('adminPw').value = '';
      showAdmin(); loadList();
    } catch {
      $('loginErr').textContent = 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ กรุณาลองใหม่';
    } finally { btn.disabled = false; }
  };

  $('logout').onclick = () => {
    WifiQR.post({ action: 'logout', token }).catch(() => {});
    showLogin();
  };

  // ---------- list ----------
  async function loadList() {
    try {
      const res = await WifiQR.list();
      if (!res.ok) throw new Error();
      networks = res.networks; renderList();
    } catch {
      $('list').innerHTML = '<div class="empty">โหลดข้อมูลไม่สำเร็จ</div>';
    }
  }

  const secLabel = { WPA: 'WPA/WPA2', WEP: 'WEP', nopass: 'ไม่มีรหัสผ่าน' };

  function renderList() {
    const box = $('list'); box.textContent = '';
    if (!networks.length) { box.innerHTML = '<div class="empty">ยังไม่มีเครือข่าย เพิ่มได้จากฟอร์มด้านบน</div>'; return; }
    for (const n of networks) {
      const row = document.createElement('div'); row.className = 'row';
      const name = document.createElement('div'); name.className = 'name';
      const strong = document.createElement('strong'); strong.textContent = n.ssid;
      const small = document.createElement('small');
      small.textContent = `${secLabel[n.security]}${n.security !== 'nopass' ? ' · รหัส: ' + n.password : ''}${n.hidden ? ' · ซ่อนชื่อ' : ''}`;
      name.append(strong, small);

      const btns = document.createElement('div'); btns.className = 'btns';
      const mk = (text, fn, cls) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = text; if (cls) b.className = cls; b.onclick = () => fn(b); return b; };
      btns.append(
        mk('แก้ไข', () => startEdit(n)),
        mk('ดาวน์โหลด', () => { const c = document.createElement('canvas'); WifiQR.drawCard(c, n); WifiQR.download(c, n.ssid); }),
        mk('คัดลอกลิงก์', b => copyLink(n, b)),
        mk('ลบ', b => remove(n, b), 'danger')
      );
      row.append(name, btns);
      box.append(row);
    }
  }

  function copyLink(n, btn) {
    const url = new URL('wifi.html?id=' + encodeURIComponent(n.id), location.href).href;
    navigator.clipboard.writeText(url).then(
      () => { btn.textContent = 'คัดลอกแล้ว'; setTimeout(() => btn.textContent = 'คัดลอกลิงก์', 1500); },
      () => prompt('คัดลอกลิงก์นี้', url)
    );
  }

  // ---------- form ----------
  const fields = ['ssid', 'security', 'password', 'hidden', 'title'];
  function formData() {
    return {
      id: editingId || undefined,
      ssid: $('ssid').value.trim(),
      security: $('security').value,
      password: $('security').value === 'nopass' ? '' : $('password').value,
      hidden: $('hidden').checked,
      title: $('title').value.trim()
    };
  }
  function fillForm(n) {
    $('ssid').value = n.ssid; $('security').value = n.security; $('password').value = n.password || '';
    $('hidden').checked = !!n.hidden; $('title').value = n.title || '';
    updatePw(); preview();
  }
  function resetForm() {
    editingId = null; $('netForm').reset(); $('formTitle').textContent = 'เพิ่มเครือข่ายใหม่';
    $('cancelEdit').hidden = true; $('formErr').textContent = ''; updatePw(); preview();
  }
  function startEdit(n) {
    editingId = n.id; fillForm(n);
    $('formTitle').textContent = 'แก้ไข: ' + n.ssid; $('cancelEdit').hidden = false;
    $('formErr').textContent = '';
    $('ssid').scrollIntoView({ behavior: 'smooth', block: 'center' }); $('ssid').focus({ preventScroll: true });
  }
  function updatePw() { $('pwBlock').hidden = $('security').value === 'nopass'; }

  function preview() {
    const n = formData(), err = WifiQR.validate(n);
    const ok = !err;
    $('preview').hidden = !ok; $('previewEmpty').hidden = ok;
    if (ok) WifiQR.drawCard($('preview'), n);
  }

  fields.forEach(f => $(f).addEventListener('input', () => { updatePw(); preview(); }));
  $('cancelEdit').onclick = resetForm;

  $('netForm').onsubmit = async e => {
    e.preventDefault();
    const n = formData(), err = WifiQR.validate(n);
    $('formErr').className = 'err';
    if (err) { $('formErr').textContent = err; return; }
    const btn = $('saveBtn'); btn.disabled = true; $('formErr').textContent = 'กำลังบันทึก...';
    try {
      const res = await WifiQR.post({ action: 'save', token, network: n });
      if (res.auth === false) return showLogin(res.message);
      if (!res.ok) { $('formErr').textContent = res.message; return; }
      networks = res.networks; renderList(); resetForm();
      $('formErr').className = 'err msg-ok'; $('formErr').textContent = 'บันทึกเรียบร้อย';
    } catch {
      $('formErr').textContent = 'บันทึกไม่สำเร็จ กรุณาลองใหม่';
    } finally { btn.disabled = false; }
  };

  async function remove(n, btn) {
    if (!confirm(`ลบเครือข่าย "${n.ssid}" ?`)) return;
    btn.disabled = true;
    try {
      const res = await WifiQR.post({ action: 'delete', token, id: n.id });
      if (res.auth === false) return showLogin(res.message);
      if (!res.ok) { alert(res.message); return; }
      networks = res.networks; renderList();
      if (editingId === n.id) resetForm();
    } catch {
      alert('ลบไม่สำเร็จ กรุณาลองใหม่');
    } finally { btn.disabled = false; }
  }

  // ---------- start ----------
  WifiQR.fontsReady().then(() => {
    if (token) { showAdmin(); loadList(); } else showLogin();
    updatePw();
  });
})();
</script>
</body>
</html>
