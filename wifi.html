<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wi-Fi QR Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="wifi.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="wifi-qr.js"></script>
</head>
<body>
<main>
  <div class="top no-print">
    <div>
      <h1>Wi-Fi QR Code</h1>
      <p class="lead">เปิดกล้องโทรศัพท์สแกน QR Code แล้วกดเชื่อมต่อได้ทันที ไม่ต้องพิมพ์รหัสผ่าน</p>
    </div>
    <button id="printAll" hidden>พิมพ์</button>
  </div>

  <div id="status" class="empty">กำลังโหลด...</div>
  <div id="cards" class="cards"></div>

  <p class="foot no-print"><span id="allLink" hidden><a href="wifi.html">ดูทั้งหมด</a> · </span><a href="wifi-admin.html">สำหรับผู้ดูแล</a></p>
</main>

<script>
(async () => {
  const status = document.getElementById('status'), cards = document.getElementById('cards');
  const onlyId = new URLSearchParams(location.search).get('id');

  try {
    await WifiQR.fontsReady();
    let list = await WifiQR.list();
    if (onlyId) { list = list.filter(n => n.id === onlyId); document.getElementById('allLink').hidden = false; }
    if (!list.length) { status.textContent = onlyId ? 'ไม่พบเครือข่ายนี้' : 'ยังไม่มีเครือข่าย Wi-Fi'; return; }

    status.hidden = true;
    document.getElementById('printAll').hidden = false;
    for (const n of list) {
      const card = document.createElement('div'); card.className = 'card';
      const canvas = document.createElement('canvas');
      canvas.setAttribute('role', 'img');
      canvas.setAttribute('aria-label', `QR Code สำหรับเชื่อมต่อ Wi-Fi ${n.ssid}`);
      WifiQR.drawCard(canvas, n);
      const actions = document.createElement('div'); actions.className = 'actions no-print';
      const dl = document.createElement('button'); dl.textContent = 'ดาวน์โหลด PNG';
      dl.onclick = () => WifiQR.download(canvas, n.ssid);
      actions.append(dl);
      card.append(canvas, actions);
      cards.append(card);
    }
  } catch (e) {
    status.textContent = 'โหลดข้อมูลไม่สำเร็จ กรุณารีเฟรชหน้าอีกครั้ง';
  }
  document.getElementById('printAll').onclick = () => window.print();
})();
</script>
</body>
</html>
